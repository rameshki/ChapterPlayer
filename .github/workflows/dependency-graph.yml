name: Dependency graph

# Sends the Gradle dependency list to GitHub, so Dependabot alerts report known vulnerabilities in what the app uses.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    name: Submit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # Needs "Dependency graph" turned on in the repository settings (Settings, Advanced Security). Until then the
      # submission is refused, so this step must not turn every push red.
      - uses: gradle/actions/dependency-submission@v6
        continue-on-error: true
        with:
          dependency-graph: generate-and-submit

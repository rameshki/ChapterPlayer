name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push cancels the older run of a pull request only. A run on main always finishes, so every commit there has a result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.filter.outputs.build }}
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide which jobs the change needs
        id: filter
        # Pushes to main and manual runs build everything. A pull request skips the jobs its files cannot affect; a skipped
        # job counts as passed for a required check. Docs only (docs/, Markdown, LICENSE, NOTICE): no build at all.
        # iOS runs when shared/, iosApp/, a Gradle file or this workflow changed.
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "ios=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "$files"
          if echo "$files" | grep -Evq '^(docs/|LICENSE$|NOTICE$)|\.md$'; then build=true; else build=false; fi
          if echo "$files" | grep -Eq '^(shared/|iosApp/|gradle/|\.github/workflows/android\.yml$)|(^|/)(build|settings)\.gradle\.kts$|(^|/)gradle\.properties$'; then ios=true; else ios=false; fi
          echo "build=$build" >> "$GITHUB_OUTPUT"; echo "ios=$ios" >> "$GITHUB_OUTPUT"

  build:
    name: Build & unit test
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK and run unit tests
        # R2 experiment: compareRoborazziAndroidHostTest runs every host test and writes the screenshot comparison without
        # failing on a difference, to see whether the goldens recorded on Windows match what Linux draws.
        run: ./gradlew :androidApp:assembleDebug :androidApp:testDebugUnitTest :shared:compareRoborazziAndroidHostTest --stacktrace

      - name: Screenshot comparison summary
        if: always()
        run: |
          echo "goldens: $(ls shared/src/androidHostTest/screenshots/*.png 2>/dev/null | wc -l)"
          echo "compare images (changed): $(find shared/build/outputs/roborazzi -name '*_compare.png' 2>/dev/null | wc -l)"
          find shared/build/outputs/roborazzi -type f 2>/dev/null | head -20

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: roborazzi-compare
          path: |
            shared/build/outputs/roborazzi
            shared/build/reports/roborazzi
          if-no-files-found: warn
          retention-days: 14

      - name: Build the minified release APK and run Android lint
        # The APK testers get is the R8 release build; lint fails on anything not in androidApp/lint-baseline.xml.
        run: ./gradlew :androidApp:assembleRelease :androidApp:lintRelease --stacktrace

      - name: Check R8 still keeps the widget callbacks and receivers
        run: bash scripts/check-r8-seeds.sh

      - name: Check the Room schema did not change
        # The build regenerates shared/schemas. A difference means an entity changed without a migration.
        run: git diff --exit-code -- shared/schemas

      - uses: actions/upload-artifact@v7
        # The full test reports (and screenshot differences) of a failed run, so a failure can be read, not guessed.
        if: failure()
        with:
          name: test-reports
          path: |
            shared/build/reports/tests
            shared/build/test-results
            androidApp/build/reports/tests
            shared/build/outputs/roborazzi
            shared/build/reports/roborazzi
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v7
        with:
          name: app-release-unsigned
          path: androidApp/build/outputs/apk/release/*.apk
          retention-days: 14

  ios:
    name: iOS framework & app shell
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: macos-15
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Link the shared framework for the simulator
        run: ./gradlew :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace

      - name: Run the shared tests on the iOS simulator
        # commonTest (the pure rules and the iOS stand-ins) on Kotlin/Native. The Kotlin plugin picks Xcode's default
        # test simulator and boots it. The same tests also run on the JVM in the build job (testAndroidHostTest).
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen

      - name: Build the iOS app for the simulator
        run: |
          xcodebuild -project iosApp/ChapterPlayer.xcodeproj -scheme ChapterPlayer \
            -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build

      - name: Build the unsigned iOS app for devices and package an .ipa
        # About 20 minutes: only on merges to main and manual runs, so pull request checks stay quick.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        # Sideloadly (Windows) signs this .ipa with a free Apple ID and installs it over USB. See docs/IOS_SIDELOAD.md.
        run: |
          xcodebuild -project iosApp/ChapterPlayer.xcodeproj -scheme ChapterPlayer             -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'             ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""             -derivedDataPath build/ios build
          mkdir -p build/ipa/Payload
          cp -R build/ios/Build/Products/Release-iphoneos/ChapterPlayer.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../ChapterPlayer-unsigned.ipa Payload)
          ls -la build/ChapterPlayer-unsigned.ipa

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ios-test-reports
          path: |
            shared/build/reports/tests
            shared/build/test-results
          if-no-files-found: ignore
          retention-days: 14

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        with:
          name: ChapterPlayer-unsigned-ipa
          path: build/ChapterPlayer-unsigned.ipa
          retention-days: 14

# Describes the Xcode project. The .xcodeproj is generated from this file (brew install xcodegen; xcodegen)
# and is not committed.
name: ChapterPlayer
options:
  bundleIdPrefix: com.chapterplayer
  deploymentTarget:
    iOS: "16.0"
targets:
  ChapterPlayer:
    type: application
    platform: iOS
    sources:
      - ChapterPlayer
    # XcodeGen writes this Info.plist (not committed); Xcode adds the keys its build settings generate.
    info:
      path: ChapterPlayer/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Compose Multiplatform checks this at start (PlistSanityCheck) and stops the app without it: ProMotion screens
        # may then run above 60 Hz.
        CADisableMinimumFrameDurationOnPhone: true
        # Audiobookshelf and Plex servers on the home network: iOS asks once before the app may reach them.
        NSLocalNetworkUsageDescription: ChapterPlayer connects to your Audiobookshelf and Plex servers on your local network.
        # Home servers are often plain http (a LAN address or a home DNS name, no certificate), so plain http is
        # allowed everywhere. Only this key: with NSAllowsLocalNetworking beside it iOS would ignore it. Fine for a
        # sideloaded build; an App Store build would need a narrower exception.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    preBuildScripts:
      - name: Build the shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chapterplayer.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # The shared framework is built for Apple-silicon simulators only.
        EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "-framework Shared"

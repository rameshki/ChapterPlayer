# Describes the Xcode project. The .xcodeproj is generated from this file (brew install xcodegen; xcodegen)
# and is not committed.
name: ChapterPlayer
options:
  bundleIdPrefix: com.chapterplayer
  deploymentTarget:
    iOS: "16.0"
targets:
  ChapterPlayer:
    type: application
    platform: iOS
    sources:
      - ChapterPlayer
    preBuildScripts:
      - name: Build the shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chapterplayer.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "-framework Shared"
